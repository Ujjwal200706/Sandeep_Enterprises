name: Sync Backend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Installs the official Hugging Face command line / hub utility SDK
      - name: Install Hugging Face Hub Client
        run: pip install huggingface_hub

      # Runs a 3-line native python command to upload just the folder
      - name: Upload Backend Subdirectory to Space Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi(token='${{ secrets.HF_TOKEN }}')
          api.upload_folder(
              folder_path='backend',
              repo_id='UjjwalAgg/Sandeep_Enterprises',
              repo_type='space'
          )
          "
